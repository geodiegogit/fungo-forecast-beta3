name: Aggiornamento Previsioni Funghi 2

on:
  schedule:
    # Esegue ogni notte alle 02:00 UTC (04:00 ora italiana estiva)
    - cron: '13 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt

      - name: Esegui elaborazione
        run: |
          python main.py

      - name: Salva e carica JSON aggiornato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # storico_indici.json: confronto previsione vs ritrovamenti nel tempo.
          # stagione.json: memoria persistente della senescenza fogliare
          # confermata (non si resetta con la prima pioggia successiva).
          git add data/previsioni.json data/storico.json data/storico_indici.json data/stagione.json
          git commit -m "Auto-update previsioni meteo funghi [skip ci]" || exit 0
          git push
